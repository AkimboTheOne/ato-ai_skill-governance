version: 1

activation_policy:

  purpose: >
    Define cuándo debe activarse la gobernanza cognitiva,
    con qué intensidad debe intervenir
    y qué capas de gobernanza deben participar.

  activation_model:

    philosophy: >
      La gobernanza debe activarse en proporción al
      riesgo arquitectónico, la ambigüedad operativa
      y la exposición a la complejidad, manteniendo
      `SKILL.md` autocontenido y tratando
      `AGENTS.md` como referencia local del proyecto.

    avoid:
      - constant_governance_noise
      - unnecessary_intervention
      - overblocking_low_risk_tasks
      - governance_bureaucracy

  activation_layers:

    cognitive:
      description: >
        Influye en el razonamiento, la planificación,
        la arquitectura y la evaluación de complejidad.
        `SKILL.md` permanece autocontenido; `AGENTS.md`
        es solo una referencia local del proyecto
        cuando está presente.

      artifacts:
        - FOUNDATION.md
        - SKILL.md
        - skill-charter.md
        - governance/planner-rules.yaml

    runtime:
      description: >
        Restringe el comportamiento en runtime, los
        límites de ejecución, la mutación de memoria
        y el riesgo operativo.

      artifacts:
        - governance/runtime-policy.yaml
        - memory/README.md

    evolutionary:
      description: >
        Gobierna cómo evolucionan las skills con el tiempo,
        incluida la revisión, la expansión y la preparación
        para la automatización.

      artifacts:
        - reviews/checklist.md
        - skills/templates/skill-charter.template.md
        - references/README.md

  activation_triggers:

    contextual_terms:
      - skill
      - activation
      - retrieval
      - memory
      - governance
      - auditability
      - human override
      - runtime

    structural_triggers:
      - SKILL.md
      - AGENTS.md
      - planner rules
      - runtime policy
      - activation conditions
      - memory policy
      - tool policy
      - automation
      - orchestration
      - multi-agent
      - RAG
      - vector database
      - persistent memory
      - background agent
      - recursive agent
      - tool chain

    memory_triggers:
      - memory precedence
      - global user memory
      - doctrinal promotion

    restrictive_triggers:
      - hidden persistent state
      - autonomous background execution
      - recursive orchestration
      - tool chains without clear terminal conditions
      - RAG without demonstrated retrieval need
      - vector databases without demonstrated retrieval need
      - multi-agent orchestration without operational necessity
      - framework proliferation
      - automation before process stability

    high_priority:
      - multi_agent_design
      - orchestration_proposals
      - distributed_memory
      - vector_database_introduction
      - rag_pipeline_design
      - autonomous_execution
      - runtime_scope_expansion
      - recursive_agent_patterns
      - hidden_state_proposals
      - self_modifying_behavior

    medium_priority:
      - new_skill_creation
      - skill_upgrade
      - planner_design
      - runtime_policy_changes
      - memory_strategy_changes
      - tooling_expansion
      - automation_proposals
      - architecture_refactoring

    low_priority:
      - formatting_changes
      - wording_updates
      - documentation_cleanup
      - minor_structural_adjustments

  priority_to_intervention:

    high_priority:
      default: restrictive
      escalate_to: blocking
      applies_when:
        - hidden_state_is_introduced
        - automation_precedes_stability
        - runtime_side_effects_expand
        - recursive_or_autonomous_behavior_is_proposed

    medium_priority:
      default: governing
      escalate_to: restrictive
      applies_when:
        - architecture_scope_expands
        - tool_or_memory_strategy_changes
        - planner_or_runtime_policy_changes

    low_priority:
      default: advisory
      may_suppress: true
      applies_when:
        - changes_are_non_behavioral
        - runtime_boundaries_do_not_change
        - activation_semantics_do_not_change

  intervention_levels:

    advisory:
      behavior:
        - suggest_simplification
        - expose_tradeoffs
        - recommend_review

    governing:
      behavior:
        - apply_mandatory_engineering_order
        - validate_scope_boundaries
        - highlight_complexity_risk
        - request_justification

    restrictive:
      behavior:
        - recommend_scope_reduction
        - reject_unbounded_complexity
        - block_unsafe_automation_patterns

    blocking:
      behavior:
        - require_human_confirmation
        - require_architectural_review
        - defer_high_risk_decisions

  activation_scoring:

    increase_score_if:
      - architecture_becomes_harder_to_reason_about
      - orchestration_increases
      - hidden_state_is_introduced
      - operational_boundaries_are_unclear
      - automation_precedes_stability
      - runtime_side_effects_expand
      - dependency_count_grows
      - cognitive_load_increases

    decrease_score_if:
      - architecture_is_simplified
      - dependencies_are_removed
      - workflows_become_explicit
      - reasoning_becomes_localized
      - human_auditability_improves
      - runtime_scope_reduces

  complexity_budget:

    principle: >
      La complejidad debe ser proporcional
      al problema operativo que se está resolviendo.

    reject_if:
      - solution_complexity_exceeds_problem_complexity
      - orchestration_exists_without_clear_need
      - governance_overhead_exceeds_operational_value
      - architecture_requires_excessive_explanation

  contextual_behavior:

    contextual_review:
      applies_to:
        - contextual_terms

      behavior:
        - inspect_surrounding_request
        - avoid_strong_intervention_for_incidental_mentions
        - escalate_only_when_behavior_or_governance_changes

    lightweight_mode:
      applies_to:
        - editing
        - formatting
        - low_risk_updates
        - spelling_fixes
        - non_behavioral_documentation_cleanup
        - wording_changes_without_semantic_change

      behavior:
        - minimize_governance_interruption
        - avoid_overanalysis

    governance_mode:
      applies_to:
        - architecture_design
        - runtime_design
        - automation_design
        - skill_definition
        - orchestration_changes

      behavior:
        - activate_full_governance_review
        - evaluate_complexity_budget
        - evaluate_runtime_risk
        - evaluate_human_governance

  suppression_conditions:

    suppress_or_keep_lightweight_if:
      - task_is_formatting_only
      - task_is_spelling_or_typo_fix
      - task_is_minor_wording_without_semantic_change
      - task_is_non_behavioral_documentation_cleanup
      - architecture_does_not_change
      - runtime_boundaries_do_not_change
      - activation_semantics_do_not_change
      - memory_policy_does_not_change
      - tool_policy_does_not_change
      - automation_scope_does_not_change

    do_not_suppress_if:
      - small_change_alters_operational_behavior
      - small_change_alters_activation_semantics
      - small_change_alters_runtime_boundaries
      - small_change_reduces_human_auditability
      - small_change_introduces_hidden_state

  blocking_rules:

    require_human_review_if:
      - destructive_runtime_behavior_exists
      - irreversible_side_effects_exist
      - autonomous_background_execution_exists
      - automation_precedes_process_stability
      - tool_chain_has_no_clear_terminal_condition
      - rag_lacks_demonstrated_retrieval_need
      - vector_database_lacks_demonstrated_retrieval_need
      - multi_agent_orchestration_lacks_operational_necessity
      - framework_proliferation_is_proposed
      - architecture_scope_expands_significantly
      - persistent_hidden_memory_is_introduced
      - governance_boundaries_become_unclear

  final_principle: >
    La gobernanza debe orientar el razonamiento de forma
    proporcional, sin convertirse en carga burocrática.
